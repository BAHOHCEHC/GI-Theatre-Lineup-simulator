<div
  [class.grid]="visibleCharacters().length > 0"
  class="character-grid"
>
  @for (c of visibleCharacters(); track c.id) {
    <button
      class="char"
      [class.dimmed]="!isSelected(c)"
      [class.selected]="isSelected(c)"
      (click)="toggle(c)"
    >
      <img
        class="bg"
        [src]="c.rarity.bgUrl"
      />
      <img
        class="avatar"
        [src]="c.avatarUrl"
        [alt]="c.name"
        [title]="c.name"
      />
      @if (c.element) {
        <img
          class="element"
          [src]="'/assets/images/ElementType_' + c.element.name + '.png'"
          [alt]="c.element.name"
          [title]="c.element.name"
        />
      }

      @if ((c.newIndex?.expiresAt ?? 0) > now) {
        <img
          class="new"
          src="assets/images/new.svg"
        />
      }
    </button>

    
  } @empty {
    <div class="empty-state">No characters to display by this filter.</div>
  }
</div>

@if (visibleCharacters().length > 0) {
  <div class="character-grid__toolbar">
    <button
      type="button"
      class="btn primary"
      [class.dimmed]="isAllVisibleSelected()"
      (click)="onSelectAll()"
    >
      Select all
    </button>
    <button
      type="button"
      class="btn danger"
      [class.dimmed]="isNoneVisibleSelected()"
      (click)="onClearAll()"
    >
      Clear all
    </button>
  </div>
}
