name: Deploy to Github pages
on:
    push:
        branches: [main]

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4
            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                node-version: 22.x
            - name: Install dependencies
              run: npm install --legacy-peer-deps
            - name: Build
              run: npm run build -- --configuration production --base-href /GI-Theatre-Lineup-simulator/
            - name: Deploy to GitHub Pages
              uses: peaceiris/actions-gh-pages@v4
              with:
                github_token: ${{ secrets.GITHUB_TOKEN }}
                publish_branch: gh-pages
                publish_dir: ./dist/gi-theatre-lineup-simulator/browser
